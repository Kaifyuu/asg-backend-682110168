# Files under src/test/resources shadow the same-named file under
# src/main/resources on the test classpath, so this whole file overrides
# application.properties whenever tests run.
#
# Tests get their own separate in-memory DB ("testdb" instead of "spring_db")
# and build their own fixtures via each repository, so data.sql is disabled
# here (initialization-mode=never) to keep tests isolated and deterministic -
# every test controls exactly what data exists before it runs.
#
# IMPORTANT: initialization-mode is the correct property name for Spring Boot
# 2.3.0 (this project's version). The newer "spring.sql.init.mode" name doesn't
# exist until Boot 2.5+; using it here would be silently ignored, which is
# exactly what happened during development - data.sql kept running against the
# test DB and inflated list-endpoint assertions until this was corrected.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.datasource.initialization-mode=never
