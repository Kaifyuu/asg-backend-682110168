# H2 in-memory database (per assignment requirement).
# DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the app's lifetime instead
# of being wiped the moment the last connection closes.
spring.datasource.url=jdbc:h2:mem:spring_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true

# ddl-auto=create-drop: Hibernate generates the schema from the @Entity classes
# on startup and drops it on shutdown - there are no manual SQL migration
# scripts in this project. initialization-mode=always then runs data.sql
# (Note: this app targets Spring Boot 2.3.0, which uses the OLDER
# "spring.datasource.initialization-mode" property; the newer
# "spring.sql.init.mode" name only exists from Boot 2.5+ onward - using the
# wrong one for your Boot version silently does nothing, which is exactly the
# bug that broke test isolation before this was caught.)
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.initialization-mode=always
# defer-datasource-initialization only exists from Boot 2.5+; on this project's
# Boot 2.3.0 it's a harmless no-op (kept from the original starter properties).
spring.jpa.defer-datasource-initialization=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Handy for inspecting the DB during development: http://localhost:8080/h2-console
spring.h2.console.enabled=true
